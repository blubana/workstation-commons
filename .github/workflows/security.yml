name: Security

on: [push, pull_request]

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan Git history
        shell: bash
        run: |
          archive=gitleaks_8.30.0_linux_x64.tar.gz
          curl -fsSLo "$RUNNER_TEMP/$archive" "https://github.com/gitleaks/gitleaks/releases/download/v8.30.0/$archive"
          printf '%s  %s\n' 79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e "$RUNNER_TEMP/$archive" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --report-format sarif --report-path gitleaks.sarif
      - uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        if: ${{ !cancelled() && hashFiles('gitleaks.sarif') != '' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) && (!github.event.repository.private || vars.ENABLE_CODE_SCANNING == 'true') }}
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks

  semgrep:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.5"
          enable-cache: false
      - name: Scan source
        run: uvx --from semgrep==1.150.0 semgrep scan --config p/default --config p/python --config p/rust --error --metrics=off --sarif-output semgrep.sarif
      - uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        if: ${{ !cancelled() && hashFiles('semgrep.sarif') != '' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) && (!github.event.repository.private || vars.ENABLE_CODE_SCANNING == 'true') }}
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  osv-scanner:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Scan lockfiles
        shell: bash
        run: |
          GOBIN="$RUNNER_TEMP" go install github.com/google/osv-scanner/v2/cmd/osv-scanner@v2.7.1
          "$RUNNER_TEMP/osv-scanner" scan source --lockfile=backend/uv.lock --lockfile=tui/Cargo.lock --format=sarif --output-file=osv.sarif
      - uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        if: ${{ !cancelled() && hashFiles('osv.sarif') != '' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) && (!github.event.repository.private || vars.ENABLE_CODE_SCANNING == 'true') }}
        with:
          sarif_file: osv.sarif
          category: osv-scanner

  zizmor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.5"
          enable-cache: false
      - name: Audit workflows
        run: uvx --from zizmor==1.32.0 zizmor --offline --format sarif .github/workflows > zizmor.sarif
      - uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        if: ${{ !cancelled() && hashFiles('zizmor.sarif') != '' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) && (!github.event.repository.private || vars.ENABLE_CODE_SCANNING == 'true') }}
        with:
          sarif_file: zizmor.sarif
          category: zizmor

  bandit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.5"
          enable-cache: false
      - name: Audit Python
        run: uvx --from 'bandit[sarif]==1.9.2' bandit -ll -r backend/compute_mgr npu -f sarif -o bandit.sarif
      - uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        if: ${{ !cancelled() && hashFiles('bandit.sarif') != '' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) && (!github.event.repository.private || vars.ENABLE_CODE_SCANNING == 'true') }}
        with:
          sarif_file: bandit.sarif
          category: bandit

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.5"
          python-version: "3.12"
          enable-cache: false
      - name: Test backend
        working-directory: backend
        run: uv run --locked pytest -q
      - name: Test TUI
        working-directory: tui
        run: cargo test --locked
